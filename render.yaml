services:
  - type: web
    name: intern-track-backend
    runtime: python
    rootDir: Backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: TERMS_URL
        sync: false
      - key: PRIVACY_URL
        sync: false
      - key: COOKIES_URL
        sync: false
      - key: DISCLAIMER_URL
        sync: false
      - key: ACCEPTABLE_USE_URL
        sync: false
      - key: NOTICE_AT_COLLECTION_URL
        sync: false
      - key: TERMS_VERSION
        value: v1
      - key: PRIVACY_VERSION
        value: v1
      - key: LEGAL_ENTITY_NAME
        sync: false
      - key: LEGAL_CONTACT_EMAIL
        sync: false
      - key: LEGAL_BUSINESS_ADDRESS
        sync: false
      - key: STRICT_LEGAL_CONFIG
        value: "false"
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_USER_AGENT
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
